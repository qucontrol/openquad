[project]
name = "openquad"
dynamic = ["version"]
authors = [
  {name="Alexander Blech", email="alexander.blech@fu-berlin.de"},
]
description = "Open database for multi-dimensional numerical integration"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
# Supported versions follow SPEC 0:
# https://scientific-python.org/specs/spec-0000/
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.3",
  "scipy>=1.15",
  "quaternionic",
]
keywords = [
  "quadrature",
  "integration",
  "numerical integration",
  "spherical quadrature",
  "illumination integral",
  "orientation average",
  "Euler angles",
  "orientation",
  "SO3",
  "Lebedev",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/openquad/__init__.py"

[project.optional-dependencies]
examples = [
  "matplotlib",
  "spherical",
]

# Development tools are not published with the package. Install them with
# `pip install --group dev` (pip 25.1 or newer) or `uv sync`.
[dependency-groups]
test = [
  "pytest>=9",
  "pytest-cov",
  "spherical",
]
lint = [
  "prek",
  "ruff",
]
docs = [
  "sphinx==9.2.0",
  "pydata_sphinx_theme==0.23.0",
  "intersphinx_registry",
  "sphinx-autoapi==3.8.1",
  "sphinx-copybutton==0.5.2",
  "sphinx_design==0.7.0",
  "numpydoc==1.11.0",
]
dev = [
  {include-group = "test"},
  {include-group = "lint"},
]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra"]
strict = true
log_level = "INFO"
testpaths = ["tests"]
# Turn warnings into errors. Ignore a warning only with an explicit filter and a
# comment giving the reason.
filterwarnings = ["error"]

[tool.ruff]
# The data tables are left as they are, as they will move out of the package.
# Code examples in Markdown keep their hand-written layout.
extend-exclude = ["src/openquad/data/", "*.md"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "W",     # pycodestyle warnings
  "I",     # isort
  "B",     # flake8-bugbear
  "UP",    # pyupgrade
  "C4",    # flake8-comprehensions
  "NPY",   # NumPy-specific rules
  "PT",    # flake8-pytest-style
  "PIE",   # flake8-pie
  "RET",   # flake8-return
  "RUF",   # ruff-specific rules
  "SIM",   # flake8-simplify
  "PTH",   # flake8-use-pathlib
  "PGH",   # pygrep-hooks
  "FURB",  # refurb
]

[tool.ruff.lint.isort]
known-first-party = ["openquad"]

[tool.ruff.lint.per-file-ignores]
# Findings present when ruff was introduced, not fixed yet. Remove a code once the
# file is fixed or replaced. New files get the full rule set.
"doc/conf.py" = ["F401", "SIM114"]
"src/conftest.py" = ["I001"]
"src/openquad/__init__.py" = ["F401", "I001", "RUF022"]
"src/openquad/base.py" = [
  "B006", "B024", "B904", "E722", "I001", "PIE790", "RET505", "SIM102", "SIM108",
]
"src/openquad/fibonacci.py" = ["I001", "RET506"]
"src/openquad/geometries.py" = [
  "B006", "B007", "B905", "F541", "I001", "PIE790", "PT018", "RET503", "RET505",
  "RET506", "RUF012", "SIM113", "SIM114", "W293",
]
"src/openquad/graef.py" = ["I001"]
"src/openquad/grid.py" = ["E501", "I001"]
"src/openquad/karney.py" = ["I001"]
"src/openquad/monte_carlo.py" = ["F821", "I001"]
"src/openquad/newton_cotes.py" = ["F401", "I001"]
"src/openquad/womersley.py" = ["I001", "SIM108"]
"tests/test_Rn_quadrature.py" = ["F841", "I001"]
"tests/test_S2_quadrature.py" = ["C408", "E501", "F841", "I001"]
"tests/test_SO3_quadrature.py" = ["C408", "E501", "F841", "I001"]
"tests/test_base.py" = ["F401", "I001", "SIM118"]
"tests/test_base_1d_quadrature_methods.py" = [
  "E731", "F821", "F841", "I001", "PT006", "PT011",
]
"tests/test_base_2d_quadrature_methods.py" = ["F401", "F841", "I001", "PT006"]
"tests/test_base_3d_quadrature_methods.py" = ["E501", "F401", "F841", "I001", "PT006"]
